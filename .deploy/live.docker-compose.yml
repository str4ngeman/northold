# VPS: mainnet / production
# docker compose -f .deploy/live.docker-compose.yml --env-file .env up -d
#
# 8080 is Watchtower's internal API. Do not publish it. Caddy should only
# reverse-proxy northold:3000.

services:
  northold:
    image: ghcr.io/str4ngeman/northold:latest
    container_name: northold
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=live
    networks:
      - web
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI}
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BLOCKCHAIN_NETWORK: ${BLOCKCHAIN_NETWORK:-mainnet}
      LAB_UI: ${LAB_UI:-0}
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:-}
      WATCHTOWER_URL: http://watchtower-live:8080
      WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN}
    depends_on:
      - watchtower-live

  watchtower-live:
    # containrrr/watchtower is abandoned and crashes on Docker 29+ (API 1.40+)
    image: nickfedor/watchtower:1.20.3
    container_name: watchtower-live
    restart: unless-stopped
    networks:
      - web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_SCOPE: live
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_TIMEOUT: 60s
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_ENDPOINTS: update
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN}
      REPO_USER: ${GHCR_USER:-}
      REPO_PASS: ${GHCR_TOKEN:-}

networks:
  web:
    external: true
