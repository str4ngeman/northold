services:
  northold:
    image: ghcr.io/str4ngeman/northold:latest
    container_name: northold
    restart: unless-stopped
    networks:
      - web
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI}
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.northold.rule=Host(`northold.app`)
      - traefik.http.routers.northold.entrypoints=websecure
      - traefik.http.routers.northold.tls=true
      - traefik.http.routers.northold.tls.certresolver=letsencrypt
      - traefik.http.routers.northold.service=northold
      - traefik.http.services.northold.loadbalancer.server.port=3000
      - traefik.http.routers.northold-http.rule=Host(`northold.app`)
      - traefik.http.routers.northold-http.entrypoints=web
      - traefik.http.routers.northold-http.middlewares=northold-https
      - traefik.http.middlewares.northold-https.redirectscheme.scheme=https

networks:
  web:
    external: true
